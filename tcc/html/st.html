<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otto Acessórios</title>
    
    <link rel="stylesheet" href="../css/pagina_01.css">
</head>
<body>

    
    <header class="navbar">
        <div class="logo-container">
            <span class="logo-text">Otto <small>Acessórios</small></span>
        </div>
        <div class="nav-actions">
            <button class="btn-products" id="btnProducts">Ver produtos</button>
            <div class="nav-icons">
                <div class="icon-item">
                    <span>🎛️</span>
                    <p>Categorias</p>
                </div>
                <div class="icon-item">
                    <span>🛒</span>
                    <p>Carrinho</p>
                </div>
            </div>
        </div>
    </header>

 
    <main class="hero-section">
        <div class="hero-image">
         
            <img src="../img/carro.png" alt="Carro Azul e Peças">
        
        </div>
        <div class="hero-content">
            <h1>Bem-vindo ao Otto </h1>
            <p>Acessórios de peças para carro</p>
            <button id="btn-otto" class="btn-otto-custom">
                <span class="badge-title">otto</span>
                <span class="badge-sub">acessórios</span>
              </button>            
        </div>
        </div>
        <img src="../img/otto.png" width="450"  alt="logo">
    </main>
   
    <section class="search-section">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar produtos...">
            <button class="search-btn" id="searchBtn">🔍</button>
        </div>
    </section>

   
    <section class="categories-grid">
       
        <div class="category-card" data-name="engates">
            <div class="card-img"><img src="../img/produto3.png" width="100" alt="engates"></div>
            <p>Engates</p>
        </div>
        
        <div class="category-card" data-name="chicotes">
            <div class="card-img"><img src="../img/produto2.png" width="100" alt="capotas"></div>
            <p>Capotas maritimas</p>
        </div>
       
        <div class="category-card" data-name="palhetas">
            <div class="card-img"><img src="../img/produto1.png" width="100" alt="palhetas"></div>
            <p>Palhetas</p>
        </div>
        <div class="category-card" data-name="lampadas">
            <div class="card-img"><img src="../img/image.png" width="100" alt="Lampadas"></div>
            <p>Lâmpadas</p>
        </div>

        <div class="category-card" data-name="reles">
            <div class="card-img"><img src="/tcc/img/image copy.png" width="100" alt="reles"></div>
            <p>Relés DNI</p>
        </div>

        <div class="category-card" data-name="capotas">
            <div class="card-img"><img src="/tcc/img/image copy 2.png" width="100" alt="chicote eletronico"></div>
            <p>Chicote eletronico</p>
        </div>
    </section>

    <script src="../js/st.js"></script>
</body>
</html>
