<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otto Acessórios</title>
    <!-- Conectando o arquivo CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- CONTAINER PRINCIPAL DO SITE -->
    <div class="site-wrapper">
        
        <!-- SEÇÃO SUPERIOR: HERO / BANNER PRINCIPAL -->
        <header class="hero-section">
            <!-- Lado Esquerdo: Imagem do Carro e Peças -->
            <div class="hero-imagem">
                <img src="imagens/banner-carro.png" alt="Carro azul com acessórios">
            </div>

            <!-- Lado Direito: Textos, Botões e Logotipo -->
            <div class="hero-conteudo">
                <div class="topo-botoes">
                    <button class="btn-ver-produtos" id="btnVerProdutos">ver produtos</button>
                    
                    <div class="icones-navegacao">
                        <div class="icone-item">
                            <span class="icone-grid">🌐</span>
                            <span class="texto-icone">Categorias</span>
                        </div>
                        <div class="icone-item">
                            <span class="icone-carrinho">🛒</span>
                            <span class="texto-icone">Carrinho</span>
                        </div>
                    </div>
                </div>

                <div class="bloco-boas-vindas">
                    <h1>Bem-vindo<br>ao Otto</h1>
                    <p class="subtitulo">Acessórios de peças<br>para carro</p>
                </div>

                <div class="logo-container">
                    <img src="imagens/logo-otto.png" alt="Otto Acessórios Logo" class="logo-img">
                </div>
            </div>
        </header>

        <!-- BARRA DE PESQUISA -->
        <section class="barra-pesquisa-container">
            <div class="campo-busca">
                <input type="text" id="inputBusca" placeholder="Buscar produtos...">
                <button class="btn-busca" id="btnBusca">🔍</button>
            </div>
        </section>

        <!-- GRADE DE CATEGORIAS DE PRODUTOS -->
        <main class="categorias-container">
            <div class="grid-categorias">
                
                <!-- Categoria 1 -->
                <div class="card-categoria" data-categoria="engates">
                    <div class="wrapper-img">
                        <img src="imagens/engates.png" alt="Engates">
                    </div>
                    <p>Engates</p>
                </div>

                <!-- Categoria 2 -->
                <div class="card-categoria" data-categoria="chicotes">
                    <div class="wrapper-img">
                        <img src="imagens/chicotes.png" alt="Chicotes eletrônicos">
                    </div>
                    <p>Chicotes eletronicos</p>
                </div>

                <!-- Categoria 3 -->
                <div class="card-categoria" data-categoria="palhetas">
                    <div class="wrapper-img">
                        <img src="imagens/palhetas.png" alt="Palhetas">
                    </div>
                    <p>Palhetas</p>
                </div>

                <!-- Categoria 4 -->
                <div class="card-categoria" data-categoria="lampadas">
                    <div class="wrapper-img">
                        <img src="imagens/lampadas.png" alt="Lâmpadas">
                    </div>
                    <p>Lampadas</p>
                </div>

                <!-- Categoria 5 -->
                <div class="card-categoria" data-categoria="reles">
                    <div class="wrapper-img">
                        <img src="otto.png" alt="Relés DNI">
                    </div>
                    <p>Reles DNI</p>
                </div>

                <!-- Categoria 6 -->
                <div class="card-categoria" data-categoria="capotas">
                    <div class="wrapper-img">
                        <img src="otto.png" alt="otto Acessórios Capotas Marítimas">
                    </div>
                    <p>Capotas maritimas</p>
                </div>

            </div>
        </main>

    </div>

    <!-- Conectando o arquivo JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
