<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otto - Engate Cruze Hatch</title>
  <link rel="stylesheet" href="/tcc/css/produto1.css">
</head>
<body>
  <header>
    <div class="left">
      <button>☰</button>
      <div class="logo">otto <span>ACESSÓRIOS</span></div>
    </div>
    <div class="right">
      <button class="btn-azul">Ver produtos</button>
      <span>🎛️</span>
      <span>🛒</span>
    </div>
  </header>

  <div class="busca">
    <input type="text" placeholder="Buscar produtos...">
    <span>🔍</span>
  </div>

  <main>
    <div class="fotos">
      <img src="/tcc/img/engate1.png" class="engate">
    </div>

    <div class="info">
      <h1>ENGATE CRUZE HATCH 2017 ACIMA FIXO VOLPATO COMPLETO</h1>
      <p class="preco">R$742,50</p>
      <p>Em até 3x de R$247,50 sem juros</p>
      <p class="estoque" id="estoque">Fora de estoque</p>

      <div class="qtd">
        <button id="menos">-</button>
        <span id="qtd">0</span>
        <button id="mais">+</button>
      </div>

      <button class="btn-comprar" id="btn-comprar">COMPRAR</button>
    </div>
  </main>

  <script src="/tcc/js/produto1.js"></script>
</body>
</html>
